<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="system.title">System</title>
    <link rel="stylesheet" href="styles.scss">
    <link rel="shortcut icon" href="static/favicon.png" type="image/x-icon">
</head>

<body>
    <include src="./header.html"></include>
    <div class="container">
        <div class="card shadow my-5">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="system.updateFirmware">Update Firmware</h6>
            </div>
            <div class="card-body">
                <div class="row">
                    <ol>
                        <li data-i18n="system.stepSelect">Select file with new firmware</li>
                        <li data-i18n="system.stepClick">Click "Update" button</li>
                        <li data-i18n="system.stepWait">Wait until update</li>
                    </ol>
                </div>
                <div class="row">
                    <div class="input-group m-3">
                        <form id="uploadform" enctype="multipart/form-data" method="post" action="/firmware/upload" >
                            <div class="customFile">
                                <input id="newfile" name="inobinfile" type="file" class="custom-file-input" />
                                <label class="custom-file-label" for="newfile" id="file-label" data-i18n="system.chooseFile">Choose file</label>
                                <input type="submit" value="Upload" id="submitbtn" class="uploadFile" data-i18n-value="actions.upload" />
                            </div>
                        </form>                                
                    </div>
                </div>
                    <div class="currentVersion">
                        <span id="currentVersion" data-i18n-template="system.currentVersion" data-i18n-value="%FIRMWARE%">Current version: %FIRMWARE%</span>
                    </div>
                </div>
            
        </div>
        <div class="card shadow my-5">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="system.title">System</h6>
            </div>
            <div class="card-body">
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.adminPassword">Admin password</span>
                    <a href="#" class="btn btn-primary system-btn" id="pwchange" data-i18n="actions.change">CHANGE</a>
                </div>
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.device">Device</span>
                    <a href="#" class="btn btn-warning system-btn" id="reset" data-i18n="actions.reset">RESET</a>
                </div>
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.device">Device</span>
                    <a href="#" class="btn btn-warning system-btn" id="reboot" data-i18n="actions.reboot">REBOOT</a>
                </div>
            </div>
        </div>
        <div class="card shadow my-5">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="system.users">Users</h6>
            </div>
            <div class="card-body">
                <table id="usersTable" class="table table-bordered dataTable">
                    <tbody>
                        <tr>
                            <th data-i18n="system.username">Username</th>
                            <th data-i18n="system.action">Action</th>
                        </tr>
                    </tbody>
                </table>
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.username">Username</span>
                    <div class="setting-control">
                        <input id="newUsername" class="form-control user-input" type="text" maxlength="16">
                        <small class="field-hint" data-i18n="system.usernameHint">Max 16 characters</small>
                    </div>
                </div>
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.password">Password</span>
                    <div class="setting-control">
                        <input id="newUserPassword" class="form-control user-input" type="password" maxlength="31">
                        <small class="field-hint" data-i18n="system.passwordHint">Max 31 characters</small>
                    </div>
                </div>
                <div class="row mt-4">
                    <span class="btn-label"></span>
                    <a href="#" class="btn btn-primary system-btn" id="addUser" data-i18n="actions.add">ADD</a>
                </div>
            </div>
        </div>
        <div class="card shadow my-5">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="system.skin">Skin</h6>
            </div>
            <div class="card-body">
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.skin">Skin</span>
                    <select id="themeSelect" class="form-control user-input">
                        <option value="default" data-i18n="theme.default">Default</option>
                        <option value="dark" data-i18n="theme.dark">Dark</option>
                        <option value="highContrast" data-i18n="theme.highContrast">High contrast</option>
                    </select>
                </div>
                <div class="row mt-4">
                    <span class="btn-label" data-i18n="system.language">Language</span>
                    <select id="languageSelect" class="form-control user-input">
                        <option value="en" data-i18n="language.english">English</option>
                        <option value="de" data-i18n="language.german">Deutsch</option>
                    </select>
                </div>
            </div>
        </div>
        <script src="./ts/utils.ts"></script>
        <script src="./ts/system.ts"></script>
        <include src="./dynamicStyles.html"></include>
</body>

</html>
