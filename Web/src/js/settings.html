<script>
    let relayid;
    let modeid;
    let options;
    let brightnessid;
    let speedid;
    let colorid;
    let colorSettingRow;
    let textid;
    let textSettingRow;
    let rotationid;
    let settingsLoaded = false;
    let saveTimer;
    let modeMetadata = [];

    window.onload = () => {
        relayid = document.getElementById('stateToggleid');
        modeid = document.getElementById('selectModeid');
        brightnessid = document.getElementById('brightnessid');
        speedid = document.getElementById('speedid');
        colorid = document.getElementById('colorid');
        colorSettingRow = document.getElementById('colorSettingRow');
        textid = document.getElementById('textid');
        textSettingRow = document.getElementById('textSettingRow');
        rotationid = document.getElementById('rotationid');

        bindAutoApply();
        getSettingsJSON();
    }

    function bindAutoApply() {
        relayid.onchange = () => saveSettings();
        modeid.onchange = () => {
            updateSelectedPreview(modeid.value);
            updateVisibleParameters(modeid.value);
            saveSettings();
        };
        rotationid.onchange = () => saveSettings();
        colorid.oninput = () => scheduleSave();
        colorid.onchange = () => saveSettings();
        textid.oninput = () => scheduleSave();
        textid.onchange = () => saveSettings();
        brightnessid.oninput = () => scheduleSave();
        brightnessid.onchange = () => saveSettings();
        speedid.oninput = () => scheduleSave();
        speedid.onchange = () => saveSettings();
    }

    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveSettings, 250);
    }

    function saveSettings() {
        if (!settingsLoaded || !options?.length) return;
        clearTimeout(saveTimer);
        const relayState = relayid.checked ? 1 : 0;
        const selectedMode = getModeInfo(modeid?.value);
        const fallbackModeIndex = options.indexOf(modeid?.value?.trim());
        const mode = selectedMode ? selectedMode.id : (fallbackModeIndex >= 0 ? fallbackModeIndex : 0);
        const color = hexToRgb(colorid.value).split(',');
        const data = {
            state: relayState,
            mode,
            r: color[0],
            g: color[1],
            b: color[2],
            brightness: brightnessid?.value,
            rotation: rotationid?.value || 270,
            speed: speedid?.value,
            text: textid?.value || ''
        };

        request('settings', { method: 'POST', body: data, onSuccess: () => {} });
    }

    function parseSettingsJSON(jsonstring) {
        obj = JSON.parse(jsonstring);
        if (relayid) relayid.checked = !!obj?.data?.state;
        if (modeid) modeid.value = obj?.data?.mode;
        if (colorid) colorid.value = rgbToHex(obj?.data?.color) || '#035F59';
        if (textid) textid.value = obj?.data?.text || '';
        if (brightnessid) brightnessid.value = obj?.data?.brightness;
        if (speedid) speedid.value = obj?.data?.speed || 50;
        if (rotationid) rotationid.value = String(obj?.data?.rotation ?? 270);
        if (modeid) {
            modeMetadata = Array.isArray(obj?.data?.modes) ? obj.data.modes : [];
            options = modeMetadata.length ? modeMetadata.map((mode) => mode.name) : obj?.data?.states?.split(',');
            const modeHint = document.getElementById('modeHint');
            if (modeHint && options?.length) modeHint.textContent = options.join(', ');

            for (const opt of options) {
                const el = document.createElement("option");
                el.textContent = opt;
                el.value = opt;
                modeid.appendChild(el);
            }

            if(obj?.data?.mode) {
                modeid.value = obj?.data?.mode;
            }
            fillModePreviews(options, modeid.value);
            updateVisibleParameters(modeid.value);
            settingsLoaded = true;
        }
    }

    function getModeInfo(mode) {
        const normalizedMode = (mode || '').toLowerCase();
        return modeMetadata.find((item) => (item.name || '').toLowerCase() === normalizedMode);
    }

    function usesColor(mode) {
        const info = getModeInfo(mode);
        return info ? !!info.usesColor : ['color', 'parts', 'text'].includes((mode || '').toLowerCase());
    }

    function usesText(mode) {
        const info = getModeInfo(mode);
        return info ? !!info.usesText : (mode || '').toLowerCase() === 'text';
    }

    function usesSpeed(mode) {
        const info = getModeInfo(mode);
        return !info || !!info.usesSpeed;
    }

    function usesRotation(mode) {
        const info = getModeInfo(mode);
        return !info || !!info.usesRotation;
    }

    function updateVisibleParameters(mode) {
        if (colorSettingRow) {
            colorSettingRow.style.display = usesColor(mode) ? '' : 'none';
        }
        if (textSettingRow) {
            textSettingRow.style.display = usesText(mode) ? '' : 'none';
        }
        if (speedid?.closest('.row')) {
            speedid.closest('.row').style.display = usesSpeed(mode) ? '' : 'none';
        }
        if (rotationid?.closest('.row')) {
            rotationid.closest('.row').style.display = usesRotation(mode) ? '' : 'none';
        }
    }

    function modeClass(mode) {
        return `mode-${mode.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
    }

    function fillModePreviews(modes, selectedMode) {
        const grid = document.getElementById('modePreviewGrid');
        if (!grid || !modes?.length) return;
        grid.innerHTML = '';

        modes.forEach((mode) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `mode-preview ${modeClass(mode)}`;
            button.dataset.mode = mode;
            button.onclick = () => {
                modeid.value = mode;
                updateSelectedPreview(mode);
                updateVisibleParameters(mode);
                saveSettings();
            };

            const sample = document.createElement('span');
            sample.className = 'mode-preview-sample';
            for (let i = 0; i < 16; i++) {
                sample.appendChild(document.createElement('i'));
            }

            const label = document.createElement('span');
            label.className = 'mode-preview-label';
            label.textContent = mode;

            button.appendChild(sample);
            button.appendChild(label);
            grid.appendChild(button);
        });

        updateSelectedPreview(selectedMode);
    }

    function updateSelectedPreview(selectedMode) {
        document.querySelectorAll('.mode-preview').forEach((preview) => {
            preview.classList.toggle('selected', preview.dataset.mode === selectedMode);
        });
    }

    function getSettingsJSON() {
        request('settings', { 
            method: 'GET',
            onSuccess: (settings) => {
                try {
                    parseSettingsJSON(settings);
                } catch (e) {
                    console.error(e);
                }
            }
        });
    }

    function locationDetector() {
        const pathname = window.location.pathname.replace(/^\//, '') || 'index.html';
        const header = document.getElementById('header');
        const el = header.querySelectorAll(`a[href$="${pathname}"]`);

        if (el.length) el[0].classList.add('bold');
    }
    locationDetector();

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)},${parseInt(result[2], 16)},${parseInt(result[3], 16)}` : null;
    }

    function componentToHex(c) {
        const hex = c.toString(16);
        return hex.length === 1 ? "0" + hex : hex;
    }

    function rgbToHex(rgb) {
        if (!rgb) return null;
        const [ r, g, b ] = rgb.split(',').map(x => +x);
        return "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);
    }
</script>
