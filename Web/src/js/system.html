<script>
    let currentVersion;
    let tabs;
    let platformNavs;

    window.onload = () => {
        document.getElementById('pwchange').onclick = pwchange;
        document.getElementById('reset').onclick = reset;
        document.getElementById('reboot').onclick = reboot;
        document.getElementById('addUser').onclick = addUser;
        getUsers();

        document.getElementById('submitbtn').disabled = true;
        document.getElementById('submitbtn').classList.add('disabledBtn');
        const fileInput = document.getElementById("newfile");
        fileInput.onchange = upload;
        const form = document.querySelector("form");
        form.addEventListener("submit", event => {
            event.preventDefault();
            const formData = new FormData(form)
            const response = fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                    if (response.status === 200) alert(t('alerts.firmwareUploaded'));
                    else alert(`${t('alerts.error')}\n${response.statusText}`);
                })
        });
    };

    function submitForm() {
        document.getElementById('uploadform').submit();
        return false;
    }

    function pwchange() {
        let newPassword;

        while (true) {
            newPassword = prompt(t('alerts.newPassword'));
            if (newPassword == null || newPassword == "") return;
            else break;
        }
        request('newauthpass', { method: 'POST', body: { newpass: newPassword } });
    }

function reset() {
    const res = confirm(t('alerts.resetConfirm'));
    if (res) {
        request('resetdefault', { 
            method: 'GET',
            onSuccess: () => alert(t('alerts.resetSuccess'))
        })
    }
}

function reboot() {
    const res = confirm(t('alerts.rebootConfirm'));
    if (res) {
        request('reboot', {
            method: 'GET',
            onSuccess: () => alert(t('alerts.rebooting'))
        })
    }
}

function upload() {
    document.getElementById('submitbtn').disabled = true;
    document.getElementById('submitbtn').classList.add('disabledBtn');
    const upload_path = "/firmware/upload"
    const fileInput = document.getElementById("newfile").files;
    /* Max size of an individual file. Make sure this
    * value is same as that set in file_server.c */
    const MAX_FILE_SIZE = 2048*1024;
    const MAX_FILE_SIZE_STR = "2048KB";
    const availableFormats = [
        "application/mac-binary",
        "application/macbinary",
        "application/octet-stream",
        "application/x-binary",
        "application/x-macbinary"
    ];
    if (fileInput.length == 0) {
        alert(t('alerts.fileRequired')); 
    } else if (fileInput[0].size > MAX_FILE_SIZE) {
        alert(t('alerts.fileSize', { size: MAX_FILE_SIZE_STR }));
    } else if (!availableFormats.includes(fileInput[0].type)) {
        alert(t('alerts.fileBin'));
    } else {
        document.getElementById('submitbtn').disabled = false;
        document.getElementById('submitbtn').classList.remove('disabledBtn');
        document.getElementById('file-label').innerHTML = fileInput[0].name;
    }
}

function getUsers() {
    request('auth/users', {
        method: 'GET',
        onSuccess: (response) => {
            try {
                fillUsersTable(JSON.parse(response).users || []);
            } catch (e) {
                console.error(e);
            }
        }
    });
}

function fillUsersTable(users) {
    const table = document.getElementById('usersTable');
    for (let i = table.rows.length; i > 1; i--) table.deleteRow(i - 1);

    users.forEach((username) => {
        const row = table.insertRow(-1);
        row.insertCell(0).innerHTML = username;
        const actionCell = row.insertCell(1);
        const button = document.createElement('a');
        button.href = '#';
        button.className = 'btn btn-warning system-btn';
        button.innerHTML = t('actions.delete');
        button.onclick = () => deleteUser(username);
        actionCell.appendChild(button);
    });
}

function addUser() {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newUserPassword').value;

    request('auth/users', {
        method: 'POST',
        body: { username, password },
        onSuccess: () => {
            document.getElementById('newUsername').value = '';
            document.getElementById('newUserPassword').value = '';
            getUsers();
        }
    });
}

function deleteUser(username) {
    request('auth/users/delete', {
        method: 'POST',
        body: { username },
        onSuccess: getUsers
    });
}
</script>
