    function getLanguage() {
        const savedLanguage = localStorage.getItem('language');
        if (translations[savedLanguage]) return savedLanguage;

        const browserLanguage = (navigator.language || '').slice(0, 2);
        return translations[browserLanguage] ? browserLanguage : 'en';
    }

    function t(key, params = {}) {
        let value = (translations[getLanguage()] && translations[getLanguage()][key]) || translations.en[key] || key;
        Object.keys(params).forEach((name) => {
            value = value.replace(`{${name}}`, params[name]);
        });
        return value;
    }

    function applyI18n() {
        document.documentElement.lang = getLanguage();
        document.querySelectorAll('[data-i18n]').forEach((element) => {
            element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-value]').forEach((element) => {
            element.value = t(element.dataset.i18nValue);
        });
        document.querySelectorAll('[data-i18n-template]').forEach((element) => {
            element.textContent = t(element.dataset.i18nTemplate, { value: element.dataset.i18nValue || '' });
        });

        const languageSelect = document.getElementById('languageSelect');
        if (languageSelect) {
            languageSelect.value = getLanguage();
            languageSelect.onchange = () => {
                localStorage.setItem('language', languageSelect.value);
                applyI18n();
            };
        }
    }

    function applyTheme() {
        const theme = localStorage.getItem('theme') || 'default';
        document.documentElement.dataset.theme = theme;

        const themeSelect = document.getElementById('themeSelect');
        if (themeSelect) {
            themeSelect.value = theme;
            themeSelect.onchange = () => {
                localStorage.setItem('theme', themeSelect.value);
                applyTheme();
            };
        }
    }

    function locationDetector() {
        const pathname = window.location.pathname.replace(/^\//, '') || 'index.html';
        const header = document.getElementById('header');
        if (!header) return;

        header.querySelectorAll('a[data-page]').forEach((link) => {
            const page = link.dataset.page;
            link.href = page;
            link.onclick = (event) => {
                event.preventDefault();
                window.location.assign(page);
            };

            if (page === pathname || (pathname === '' && page === 'index.html')) {
                link.classList.add('bold');
            } else {
                link.classList.remove('bold');
            }
        });
    }

    function bindMenuToggle() {
        const button = document.getElementById('menuToggle');
        const header = document.getElementById('header');
        if (!button || !header) return;

        button.onclick = () => {
            const isOpen = header.classList.toggle('show');
            button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        };
    }

    function request(url, { method, body, onSuccess, onError }) {
        const hostname = '';
        switch(method) {
            case 'GET':
                fetch(`${hostname}/${url}`)
                .then(response => {
                    if (response.status === 200) {
                        if (!onSuccess) alert(response.statusText);
                        return response.text();
                    }
                    else {
                        alert(`${t('alerts.error')}\n${response.statusText}`);
                        onError && onError();
                    }
                })
                .then(text => onSuccess && onSuccess(text))
                .catch((error) => alert(`${t('alerts.error')}\n${error}`))
                break;
            case 'POST':
                fetch(`${hostname}/${url}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(body || {})
                })
                .then(response => {
                    if (response.status === 200) {
                        if (!onSuccess) alert(response.statusText);
                        return response.text();
                    }
                    alert(`${t('alerts.error')}\n${response.statusText}`);
                    onError && onError();
                })
                .then(text => onSuccess && onSuccess(text))
                .catch((error) => alert(`${t('alerts.error')}\n${error}`))
                break;
        }
    }
    locationDetector();
    bindMenuToggle();
    applyI18n();
    applyTheme();
