    function getLanguage() {
        const savedLanguage = localStorage.getItem('language');
        if (translations[savedLanguage]) return savedLanguage;

        const browserLanguage = (navigator.language || '').slice(0, 2);
        return translations[browserLanguage] ? browserLanguage : 'en';
    }

    function t(key, params = {}) {
        let value = (translations[getLanguage()] && translations[getLanguage()][key]) || translations.en[key] || key;
        Object.keys(params).forEach((name) => {
            value = value.replace(`{${name}}`, params[name]);
        });
        return value;
    }

    function applyI18n() {
        document.documentElement.lang = getLanguage();
        document.querySelectorAll('[data-i18n]').forEach((element) => {
            element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-value]').forEach((element) => {
            element.value = t(element.dataset.i18nValue);
        });
        document.querySelectorAll('[data-i18n-template]').forEach((element) => {
            element.textContent = t(element.dataset.i18nTemplate, { value: element.dataset.i18nValue || '' });
        });

        const languageSelect = document.getElementById('languageSelect');
        if (languageSelect) {
            languageSelect.value = getLanguage();
            languageSelect.onchange = () => {
                localStorage.setItem('language', languageSelect.value);
                applyI18n();
            };
        }
    }

    function locationDetector() {
        const pathname = window.location.pathname.replace(/^\//, '') || 'index.html';
        const header = document.getElementById('header');
        const el = header.querySelectorAll(`a[href$="${pathname}"]`);

        if (el.length) el[0].classList.add('bold');
    }

    function request(url, { method, onSuccess, onError }) {
        const hostname = '';
        switch(method) {
            case 'GET':
                fetch(`${hostname}/${url}`)
                .then(response => {
                    if (response.status === 200) {
                        if (!onSuccess) alert(response.statusText);
                        return response.text();
                    }
                    else {
                        alert(`${t('alerts.error')}\n${response.statusText}`);
                        onError && onError();
                    }
                })
                .then(text => onSuccess && onSuccess(text))
                .catch((error) => alert(`${t('alerts.error')}\n${error}`))
        }
    }
    locationDetector();
    applyI18n();
