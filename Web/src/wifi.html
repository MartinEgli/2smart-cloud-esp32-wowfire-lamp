<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title data-i18n="wifi.title">Wi-Fi</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="shortcut icon" href="static/favicon.png" type="image/x-icon">
	</head>
  	<body>
        <include src="./header.html"></include>
		<div class="container">
			<div class="card shadow my-5 wifi-container">
				<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
					<h6 class="m-0 font-weight-bold text-primary" data-i18n="wifi.network">Network</h6>
					<input type="button" value="SCAN" id="refreshbtn" class="btn btn-primary btn-user" data-i18n-value="actions.scan">
				</div>
				<div class="card-body">
					<table id="myTable" class="table table-bordered dataTable">
						<tbody>
							<tr>
								<th>SSID</th>
								<th data-i18n="wifi.secured">Secured</th>
								<th data-i18n="wifi.signal">Signal</th>
							</tr>
							<!-- Line below is required for correct css compile -->
							<tr style="display: none;"><td></td></tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
        <script src="./ts/utils.ts"></script>
        <script src="./ts/wifi.ts"></script>
		<include src="./dynamicStyles.html"></include>
	</body>
</html>
